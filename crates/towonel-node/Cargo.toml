[package]
name = "towonel-node"
version.workspace = true
rust-version.workspace = true
edition = "2024"
publish = false

[[bin]]
name = "towonel"
path = "src/main.rs"

[dependencies]
towonel-common = { path = "../towonel-common" }
iroh = { workspace = true }
sea-orm = { workspace = true }
sea-orm-migration = { workspace = true }
async-trait = { workspace = true }
bytes = { workspace = true }
url = { workspace = true }
ciborium = { workspace = true }
tokio = { workspace = true }
clap = { workspace = true }
serde = { workspace = true }
# Admin subcommands depend on the following crates.
humantime = "2"
aes-gcm = { workspace = true }
argon2 = { workspace = true }
rpassword = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow = { workspace = true }
axum = { workspace = true }
axum-server = { workspace = true }
ed25519-dalek = { workspace = true }
fips204 = { workspace = true }
hex = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true }
prometheus = { workspace = true }
base64 = { workspace = true }
getrandom = { workspace = true }
tokio-stream = { workspace = true }
tokio-util = { workspace = true }
# Used by hub API tests + admin CLI as an HTTP client.
reqwest = { workspace = true }
tower_governor = { workspace = true }
subtle = { workspace = true }
rustls = { workspace = true }
certon = { workspace = true }
rcgen = { workspace = true }
sha2 = { workspace = true }
arc-swap = { workspace = true }
socket2 = { workspace = true }
moka = { workspace = true }
openidconnect = { workspace = true }
zeroize = { workspace = true }
backon = { workspace = true }
papaya = { workspace = true }
smallvec = { workspace = true }
fastrand = { workspace = true }
envy = { workspace = true }
tabled = { workspace = true }
totp-rs = { workspace = true }
ppp = { workspace = true }
ipnet = { workspace = true }
webauthn-rs = { workspace = true }
uuid = { workspace = true }
utoipa = { workspace = true }
utoipa-swagger-ui = { workspace = true }
openssl = { version = "0.10", features = ["vendored"] }

[dev-dependencies]

[package.metadata.cargo-machete]
# `openssl` is declared only to force the `vendored` feature on the
# transitive dep pulled in by webauthn-rs; it's never imported here.
ignored = ["openssl"]

[lints]
workspace = true
