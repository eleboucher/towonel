pre-commit:
  parallel: true
  commands:
    fmt:
      glob: "**/*.rs"
      run: rustfmt --edition 2024 --check {staged_files}
    clippy:
      glob: "**/*.rs"
      run: cargo clippy --workspace --all-targets --all-features -- -D warnings
    machete:
      glob: "{Cargo.toml,Cargo.lock}"
      run: cargo machete
    taplo:
      glob: "**/*.toml"
      run: taplo fmt --check {staged_files}
    typos:
      run: typos {staged_files}
    # Regenerate the charts' committed README + values.schema.json + synced
    # dashboards whenever their inputs change, and stage them. CI's
    # helm-docs-check is the backstop.
    helm-docs:
      glob: "{charts/*/{Chart.yaml,values.yaml,README.md.gotmpl},deploy/grafana/*.json}"
      run: mise run helm-docs && git add charts/*/README.md charts/*/values.schema.json charts/*/dashboards
pre-push:
  parallel: true
  commands:
    deny:
      glob: "{Cargo.toml,Cargo.lock}"
      run: cargo deny --all-features check
    doc:
      glob: "**/*.rs"
      env:
        RUSTDOCFLAGS: "-D warnings"
      run: cargo doc --workspace --all-features --no-deps
