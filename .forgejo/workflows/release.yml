---
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: docker
    steps:
      - uses: https://data.forgejo.org/actions/checkout@v6
      - uses: https://github.com/dtolnay/rust-toolchain@stable
      - uses: https://github.com/taiki-e/install-action@v2
        with:
          tool: cargo-nextest,cargo-deny
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo nextest run --workspace --all-features --no-fail-fast
      - run: cargo deny --all-features check

  release:
    needs: [tests]
    permissions:
      contents: write
    runs-on: docker
    outputs:
      release_id: ${{ steps.create.outputs.release_id }}
      tag: ${{ steps.create.outputs.tag }}
    steps:
      - uses: https://data.forgejo.org/actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install git-cliff
        env:
          GIT_CLIFF_VERSION: "2.12.0"
        run: |
          set -euo pipefail
          ASSET="git-cliff-${GIT_CLIFF_VERSION}-x86_64-unknown-linux-gnu.tar.gz"
          BASE="https://github.com/orhun/git-cliff/releases/download/v${GIT_CLIFF_VERSION}"
          wget -q "${BASE}/${ASSET}"
          wget -q "${BASE}/${ASSET}.sha512"
          sha512sum -c "${ASSET}.sha512"
          tar -xzf "${ASSET}" -C /tmp
          install -m 0755 "/tmp/git-cliff-${GIT_CLIFF_VERSION}/git-cliff" /usr/local/bin/git-cliff

      - name: Generate release notes
        id: changelog
        run: |
          set -euo pipefail
          CONTENT="$(git-cliff --config cliff.toml --latest --strip all)"
          printf 'content<<EOF\n%s\nEOF\n' "$CONTENT" >> "$GITHUB_OUTPUT"

      - name: Create Forgejo release
        id: create
        env:
          GITEA_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_BODY: ${{ steps.changelog.outputs.content }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF#refs/tags/}"
          RESPONSE="$(jq -n \
            --arg tag "$TAG" \
            --arg name "$TAG" \
            --arg body "$RELEASE_BODY" \
            '{tag_name: $tag, name: $name, body: $body, draft: false, prerelease: false}' \
            | curl -fsSL -X POST \
                -H "Authorization: token ${GITEA_TOKEN}" \
                -H "Content-Type: application/json" \
                --data-binary @- \
                "https://git.erwanleboucher.dev/api/v1/repos/${GITHUB_REPOSITORY}/releases")"
          RELEASE_ID="$(echo "$RESPONSE" | jq -r '.id')"
          if [ -z "$RELEASE_ID" ] || [ "$RELEASE_ID" = "null" ]; then
            echo "failed to parse release id from response: $RESPONSE" >&2
            exit 1
          fi
          echo "release_id=$RELEASE_ID" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

  binaries:
    needs: [release]
    permissions:
      contents: write
    runs-on: docker
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            arch_label: amd64
          - target: aarch64-unknown-linux-gnu
            arch_label: arm64
    env:
      ZIG_VERSION: "0.16.0"
      CARGO_ZIGBUILD_VERSION: "0.22.3"
      # renovate: datasource=github-releases depName=sigstore/cosign
      COSIGN_VERSION: "3.0.5"
    steps:
      - uses: https://data.forgejo.org/actions/checkout@v6

      - uses: https://github.com/dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install zig + cargo-zigbuild
        run: |
          set -euo pipefail
          HOST_ARCH="$(uname -m)"
          curl -fsSL "https://ziglang.org/download/${ZIG_VERSION}/zig-${HOST_ARCH}-linux-${ZIG_VERSION}.tar.xz" \
            | tar -xJ -C /opt
          ln -sf "/opt/zig-${HOST_ARCH}-linux-${ZIG_VERSION}/zig" /usr/local/bin/zig
          HOST_TARGET="${HOST_ARCH}-unknown-linux-musl"
          curl -fsSL "https://github.com/rust-cross/cargo-zigbuild/releases/download/v${CARGO_ZIGBUILD_VERSION}/cargo-zigbuild-${HOST_TARGET}.tar.xz" \
            | tar -xJO "cargo-zigbuild-${HOST_TARGET}/cargo-zigbuild" > /usr/local/bin/cargo-zigbuild
          chmod +x /usr/local/bin/cargo-zigbuild

      - name: Install cosign
        run: |
          set -euo pipefail
          HOST_ARCH="$(uname -m)"
          case "$HOST_ARCH" in
            x86_64) COSIGN_BIN="cosign-linux-amd64" ;;
            aarch64) COSIGN_BIN="cosign-linux-arm64" ;;
            *) echo "unsupported host arch: $HOST_ARCH" >&2; exit 1 ;;
          esac
          BASE="https://github.com/sigstore/cosign/releases/download/v${COSIGN_VERSION}"
          curl -fsSL -o cosign "${BASE}/${COSIGN_BIN}"
          curl -fsSL "${BASE}/cosign_checksums.txt" -o checksums.txt
          grep "[[:space:]]${COSIGN_BIN}\$" checksums.txt | sha256sum -c -
          install -m 0755 cosign /usr/local/bin/cosign
          rm -f cosign checksums.txt

      - name: Install cross-arch strip
        if: matrix.arch_label == 'arm64'
        run: |
          set -euo pipefail
          apt-get update
          apt-get install -y --no-install-recommends binutils-aarch64-linux-gnu

      - name: Build release binaries
        run: |
          set -euo pipefail
          cargo zigbuild --release --target "${{ matrix.target }}" \
            -p towonel-node -p towonel-agent

      - name: Stage and archive
        id: archive
        env:
          TAG: ${{ needs.release.outputs.tag }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          STAGE="towonel-${VERSION}-${{ matrix.arch_label }}-linux"
          case "${{ matrix.arch_label }}" in
            amd64) STRIP=strip ;;
            arm64) STRIP=aarch64-linux-gnu-strip ;;
          esac
          mkdir -p "$STAGE"
          cp "target/${{ matrix.target }}/release/towonel"       "$STAGE/towonel"
          cp "target/${{ matrix.target }}/release/towonel-agent" "$STAGE/towonel-agent"
          "$STRIP" "$STAGE/towonel" "$STAGE/towonel-agent"
          cp LICENSE README.md "$STAGE/"
          ARCHIVE="${STAGE}.tar.gz"
          tar -czf "$ARCHIVE" "$STAGE"
          sha256sum "$ARCHIVE" > "${ARCHIVE}.sha256"
          echo "archive=$ARCHIVE" >> "$GITHUB_OUTPUT"
          echo "stage=$STAGE" >> "$GITHUB_OUTPUT"

      - name: Cosign sign-blob
        env:
          COSIGN_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
        run: |
          set -euo pipefail
          ARCHIVE="${{ steps.archive.outputs.archive }}"
          cosign sign-blob --yes \
            --key env://COSIGN_KEY \
            --output-signature "${ARCHIVE}.sig" \
            "${ARCHIVE}"

      - name: Upload assets to Forgejo release
        env:
          GITEA_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ needs.release.outputs.release_id }}
          ARCHIVE: ${{ steps.archive.outputs.archive }}
        run: |
          set -euo pipefail
          upload() {
            local file="$1"
            curl -fsSL -X POST \
              -H "Authorization: token ${GITEA_TOKEN}" \
              -H "Content-Type: application/octet-stream" \
              --data-binary "@${file}" \
              "https://git.erwanleboucher.dev/api/v1/repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}/assets?name=$(basename "${file}")"
          }
          upload "${ARCHIVE}"
          upload "${ARCHIVE}.sha256"
          upload "${ARCHIVE}.sig"

  container:
    needs: [tests]
    runs-on: multiarch
    steps:
      - uses: https://data.forgejo.org/actions/checkout@v6

      - uses: https://data.forgejo.org/docker/setup-qemu-action@v4
        with:
          platforms: arm64

      - uses: https://data.forgejo.org/docker/setup-buildx-action@v4

      - name: Login to git.erwanleboucher.dev
        uses: https://data.forgejo.org/docker/login-action@v4
        with:
          registry: git.erwanleboucher.dev
          username: ${{ vars.USERNAME }}
          password: ${{ secrets.OWNER_PACKAGE_SECRET }}

      - name: Login to registry.erwanleboucher.dev
        uses: https://data.forgejo.org/docker/login-action@v4
        with:
          registry: registry.erwanleboucher.dev
          username: ${{ vars.USERNAME }}
          password: ${{ secrets.APOCI_REGISTRY_TOKEN }}

      - name: Compute node image metadata
        id: meta-node
        uses: https://data.forgejo.org/docker/metadata-action@v6
        with:
          images: |
            git.erwanleboucher.dev/${{ vars.USERNAME }}/towonel-node
            registry.erwanleboucher.dev/${{ vars.USERNAME }}/towonel-node
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push towonel-node
        uses: https://data.forgejo.org/docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.node
          platforms: linux/amd64,linux/arm64
          push: true
          sbom: true
          provenance: mode=max
          tags: ${{ steps.meta-node.outputs.tags }}
          labels: ${{ steps.meta-node.outputs.labels }}
          cache-from: type=gha,scope=towonel-node
          cache-to: type=gha,scope=towonel-node,mode=max

      - name: Compute agent image metadata
        id: meta-agent
        uses: https://data.forgejo.org/docker/metadata-action@v6
        with:
          images: |
            git.erwanleboucher.dev/${{ vars.USERNAME }}/towonel-agent
            registry.erwanleboucher.dev/${{ vars.USERNAME }}/towonel-agent
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push towonel-agent
        uses: https://data.forgejo.org/docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.agent
          platforms: linux/amd64,linux/arm64
          push: true
          sbom: true
          provenance: mode=max
          tags: ${{ steps.meta-agent.outputs.tags }}
          labels: ${{ steps.meta-agent.outputs.labels }}
          cache-from: type=gha,scope=towonel-agent
          cache-to: type=gha,scope=towonel-agent,mode=max

      - name: Compute hub-caddy image metadata
        id: meta-hub-caddy
        uses: https://data.forgejo.org/docker/metadata-action@v6
        with:
          images: |
            git.erwanleboucher.dev/${{ vars.USERNAME }}/towonel-hub-caddy
            registry.erwanleboucher.dev/${{ vars.USERNAME }}/towonel-hub-caddy
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push towonel-hub-caddy
        uses: https://data.forgejo.org/docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.hub-caddy
          platforms: linux/amd64,linux/arm64
          push: true
          sbom: true
          provenance: mode=max
          tags: ${{ steps.meta-hub-caddy.outputs.tags }}
          labels: ${{ steps.meta-hub-caddy.outputs.labels }}
          cache-from: type=gha,scope=towonel-hub-caddy
          cache-to: type=gha,scope=towonel-hub-caddy,mode=max
