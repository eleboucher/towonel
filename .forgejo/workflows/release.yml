name: Release
on:
  push:
    tags:
      - "v*"
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  release:
    permissions:
      contents: write
    runs-on: docker
    outputs:
      release_id: ${{ steps.create.outputs.release_id }}
      tag: ${{ steps.create.outputs.tag }}
    steps:
      - uses: https://data.forgejo.org/actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Install git-cliff
        env:
          GIT_CLIFF_VERSION: "2.12.0"
        run: |
          set -euo pipefail
          ASSET="git-cliff-${GIT_CLIFF_VERSION}-x86_64-unknown-linux-gnu.tar.gz"
          BASE="https://github.com/orhun/git-cliff/releases/download/v${GIT_CLIFF_VERSION}"
          wget -q "${BASE}/${ASSET}"
          wget -q "${BASE}/${ASSET}.sha512"
          sha512sum -c "${ASSET}.sha512"
          tar -xzf "${ASSET}" -C /tmp
          install -m 0755 "/tmp/git-cliff-${GIT_CLIFF_VERSION}/git-cliff" /usr/local/bin/git-cliff
      - name: Generate release notes
        id: changelog
        run: |
          set -euo pipefail
          CONTENT="$(git-cliff --config cliff.toml --latest --strip all)"
          printf 'content<<EOF\n%s\nEOF\n' "$CONTENT" >> "$GITHUB_OUTPUT"
      - name: Create Codeberg release
        id: create
        env:
          CODEBERG_TOKEN: ${{ secrets.CODEBERG_TOKEN }}
          RELEASE_BODY: ${{ steps.changelog.outputs.content }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF#refs/tags/}"
          if [ -z "${CODEBERG_TOKEN:-}" ]; then
            echo "CODEBERG_TOKEN secret is empty or missing" >&2
            exit 1
          fi
          RESPONSE="$(jq -n \
            --arg tag "$TAG" \
            --arg name "$TAG" \
            --arg body "$RELEASE_BODY" \
            '{tag_name: $tag, name: $name, body: $body, draft: false, prerelease: false}' \
            | curl -sS -X POST \
                -w '\n%{http_code}' \
                -H "Authorization: token ${CODEBERG_TOKEN}" \
                -H "Content-Type: application/json" \
                --data-binary @- \
                "https://codeberg.org/api/v1/repos/${GITHUB_REPOSITORY}/releases")"
          HTTP_CODE="${RESPONSE##*$'\n'}"
          BODY="${RESPONSE%$'\n'*}"
          if [ "$HTTP_CODE" != "201" ]; then
            echo "Codeberg release create failed: HTTP $HTTP_CODE" >&2
            echo "$BODY" >&2
            exit 1
          fi
          RELEASE_ID="$(echo "$BODY" | jq -r '.id')"
          if [ -z "$RELEASE_ID" ] || [ "$RELEASE_ID" = "null" ]; then
            echo "failed to parse release id from response: $BODY" >&2
            exit 1
          fi
          echo "release_id=$RELEASE_ID" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
  container:
    needs: [release]
    permissions:
      contents: write
    runs-on: multiarch
    outputs:
      node-digest: ${{ steps.build-node.outputs.digest }}
      agent-digest: ${{ steps.build-agent.outputs.digest }}
    env:
      # renovate: datasource=github-releases depName=sigstore/cosign
      COSIGN_VERSION: "3.0.5"
    steps:
      - uses: https://data.forgejo.org/actions/checkout@v6
      - uses: https://data.forgejo.org/docker/setup-qemu-action@v4
        with:
          platforms: arm64
      - uses: https://data.forgejo.org/docker/setup-buildx-action@v4
      - uses: https://github.com/dtolnay/rust-toolchain@1.96.0
      - uses: https://github.com/taiki-e/install-action@v2
        with:
          tool: cargo-edit
      - name: Set version from git tag
        run: cargo set-version "${GITHUB_REF#refs/tags/v}"
      - name: Login to codeberg.org
        uses: https://data.forgejo.org/docker/login-action@v4
        with:
          registry: codeberg.org
          username: ${{ vars.USERNAME }}
          password: ${{ secrets.CODEBERG_TOKEN }}
      - name: Login to registry.erwanleboucher.dev
        uses: https://data.forgejo.org/docker/login-action@v4
        with:
          registry: registry.erwanleboucher.dev
          username: ${{ vars.USERNAME }}
          password: ${{ secrets.APOCI_REGISTRY_TOKEN }}
      - name: Compute node image metadata
        id: meta-node
        uses: https://data.forgejo.org/docker/metadata-action@v6
        with:
          images: |
            codeberg.org/towonel/towonel-node
            registry.erwanleboucher.dev/${{ vars.USERNAME }}/towonel-node
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - name: Build and push towonel-node
        id: build-node
        uses: https://data.forgejo.org/docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.node
          platforms: linux/amd64,linux/arm64
          push: true
          sbom: true
          provenance: mode=max
          tags: ${{ steps.meta-node.outputs.tags }}
          labels: ${{ steps.meta-node.outputs.labels }}
          build-args: |
            ENABLE_SCCACHE=1
          secrets: |
            SCCACHE_AWS_ACCESS_KEY_ID=${{ secrets.SCCACHE_AWS_ACCESS_KEY_ID }}
            SCCACHE_AWS_SECRET_ACCESS_KEY=${{ secrets.SCCACHE_AWS_SECRET_ACCESS_KEY }}
          cache-from: type=registry,ref=registry.erwanleboucher.dev/${{ vars.USERNAME }}/towonel-buildcache:node
          cache-to: type=registry,ref=registry.erwanleboucher.dev/${{ vars.USERNAME }}/towonel-buildcache:node,mode=max,ignore-error=true
      - name: Extract node binaries
        uses: https://data.forgejo.org/docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.node
          platforms: linux/amd64,linux/arm64
          target: artifact
          outputs: type=local,dest=dist/node
          build-args: |
            ENABLE_SCCACHE=1
          secrets: |
            SCCACHE_AWS_ACCESS_KEY_ID=${{ secrets.SCCACHE_AWS_ACCESS_KEY_ID }}
            SCCACHE_AWS_SECRET_ACCESS_KEY=${{ secrets.SCCACHE_AWS_SECRET_ACCESS_KEY }}
          cache-from: type=registry,ref=registry.erwanleboucher.dev/${{ vars.USERNAME }}/towonel-buildcache:node
      - name: Compute agent image metadata
        id: meta-agent
        uses: https://data.forgejo.org/docker/metadata-action@v6
        with:
          images: |
            codeberg.org/towonel/towonel-agent
            registry.erwanleboucher.dev/${{ vars.USERNAME }}/towonel-agent
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - name: Build and push towonel-agent
        id: build-agent
        uses: https://data.forgejo.org/docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.agent
          platforms: linux/amd64,linux/arm64
          push: true
          sbom: true
          provenance: mode=max
          tags: ${{ steps.meta-agent.outputs.tags }}
          labels: ${{ steps.meta-agent.outputs.labels }}
          build-args: |
            ENABLE_SCCACHE=1
          secrets: |
            SCCACHE_AWS_ACCESS_KEY_ID=${{ secrets.SCCACHE_AWS_ACCESS_KEY_ID }}
            SCCACHE_AWS_SECRET_ACCESS_KEY=${{ secrets.SCCACHE_AWS_SECRET_ACCESS_KEY }}
          cache-from: type=registry,ref=registry.erwanleboucher.dev/${{ vars.USERNAME }}/towonel-buildcache:agent
          cache-to: type=registry,ref=registry.erwanleboucher.dev/${{ vars.USERNAME }}/towonel-buildcache:agent,mode=max,ignore-error=true
      - name: Extract agent binaries
        uses: https://data.forgejo.org/docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.agent
          platforms: linux/amd64,linux/arm64
          target: artifact
          outputs: type=local,dest=dist/agent
          build-args: |
            ENABLE_SCCACHE=1
          secrets: |
            SCCACHE_AWS_ACCESS_KEY_ID=${{ secrets.SCCACHE_AWS_ACCESS_KEY_ID }}
            SCCACHE_AWS_SECRET_ACCESS_KEY=${{ secrets.SCCACHE_AWS_SECRET_ACCESS_KEY }}
          cache-from: type=registry,ref=registry.erwanleboucher.dev/${{ vars.USERNAME }}/towonel-buildcache:agent
      - name: Compute hub-caddy image metadata
        id: meta-hub-caddy
        uses: https://data.forgejo.org/docker/metadata-action@v6
        with:
          images: |
            codeberg.org/towonel/towonel-hub-caddy
            registry.erwanleboucher.dev/${{ vars.USERNAME }}/towonel-hub-caddy
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - name: Build and push towonel-hub-caddy
        id: build-hub-caddy
        uses: https://data.forgejo.org/docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.hub-caddy
          platforms: linux/amd64,linux/arm64
          push: true
          sbom: true
          provenance: mode=max
          tags: ${{ steps.meta-hub-caddy.outputs.tags }}
          labels: ${{ steps.meta-hub-caddy.outputs.labels }}
          build-args: |
            ENABLE_SCCACHE=1
          secrets: |
            SCCACHE_AWS_ACCESS_KEY_ID=${{ secrets.SCCACHE_AWS_ACCESS_KEY_ID }}
            SCCACHE_AWS_SECRET_ACCESS_KEY=${{ secrets.SCCACHE_AWS_SECRET_ACCESS_KEY }}
          cache-from: type=registry,ref=registry.erwanleboucher.dev/${{ vars.USERNAME }}/towonel-buildcache:hub-caddy
          cache-to: type=registry,ref=registry.erwanleboucher.dev/${{ vars.USERNAME }}/towonel-buildcache:hub-caddy,mode=max,ignore-error=true
      - name: Install cosign
        run: |
          set -euo pipefail
          HOST_ARCH="$(uname -m)"
          case "$HOST_ARCH" in
            x86_64) COSIGN_BIN="cosign-linux-amd64" ;;
            aarch64) COSIGN_BIN="cosign-linux-arm64" ;;
            *) echo "unsupported host arch: $HOST_ARCH" >&2; exit 1 ;;
          esac
          BASE="https://github.com/sigstore/cosign/releases/download/v${COSIGN_VERSION}"
          curl -fsSL -o "${COSIGN_BIN}" "${BASE}/${COSIGN_BIN}"
          curl -fsSL "${BASE}/cosign_checksums.txt" -o checksums.txt
          grep "[[:space:]]${COSIGN_BIN}\$" checksums.txt | sha256sum -c -
          install -m 0755 "${COSIGN_BIN}" /usr/local/bin/cosign
          rm -f "${COSIGN_BIN}" checksums.txt
      - name: Cosign sign images
        env:
          COSIGN_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
          NODE_DIGEST: ${{ steps.build-node.outputs.digest }}
          AGENT_DIGEST: ${{ steps.build-agent.outputs.digest }}
          HUB_CADDY_DIGEST: ${{ steps.build-hub-caddy.outputs.digest }}
          USERNAME: ${{ vars.USERNAME }}
        run: |
          set -euo pipefail
          cosign sign --yes --key env://COSIGN_KEY \
            "codeberg.org/towonel/towonel-node@${NODE_DIGEST}" \
            "registry.erwanleboucher.dev/${USERNAME}/towonel-node@${NODE_DIGEST}" \
            "codeberg.org/towonel/towonel-agent@${AGENT_DIGEST}" \
            "registry.erwanleboucher.dev/${USERNAME}/towonel-agent@${AGENT_DIGEST}" \
            "codeberg.org/towonel/towonel-hub-caddy@${HUB_CADDY_DIGEST}" \
            "registry.erwanleboucher.dev/${USERNAME}/towonel-hub-caddy@${HUB_CADDY_DIGEST}"
      - name: Stage and archive
        env:
          TAG: ${{ needs.release.outputs.tag }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          for ARCH in amd64 arm64; do
            STAGE="towonel-${VERSION}-${ARCH}-linux"
            mkdir -p "$STAGE"
            install -m 0755 "dist/node/linux_${ARCH}/towonel"        "$STAGE/towonel"
            install -m 0755 "dist/agent/linux_${ARCH}/towonel-agent" "$STAGE/towonel-agent"
            cp LICENSE README.md "$STAGE/"
            ARCHIVE="${STAGE}.tar.gz"
            tar -czf "$ARCHIVE" "$STAGE"
            sha256sum "$ARCHIVE" > "${ARCHIVE}.sha256"
          done
      - name: Cosign sign-blob
        env:
          COSIGN_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
          TAG: ${{ needs.release.outputs.tag }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          for ARCH in amd64 arm64; do
            ARCHIVE="towonel-${VERSION}-${ARCH}-linux.tar.gz"
            cosign sign-blob --yes \
              --key env://COSIGN_KEY \
              --bundle "${ARCHIVE}.cosign.bundle" \
              "${ARCHIVE}"
          done
      - name: Upload assets to Codeberg release
        env:
          CODEBERG_TOKEN: ${{ secrets.CODEBERG_TOKEN }}
          RELEASE_ID: ${{ needs.release.outputs.release_id }}
          TAG: ${{ needs.release.outputs.tag }}
        run: |
          set -euo pipefail
          upload() {
            local file="$1"
            local response http_code body
            response="$(curl -sS -X POST \
              -w '\n%{http_code}' \
              -H "Authorization: token ${CODEBERG_TOKEN}" \
              -H "Content-Type: application/octet-stream" \
              --data-binary "@${file}" \
              "https://codeberg.org/api/v1/repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}/assets?name=$(basename "${file}")")"
            http_code="${response##*$'\n'}"
            body="${response%$'\n'*}"
            if [ "$http_code" != "201" ]; then
              echo "asset upload failed for ${file}: HTTP $http_code" >&2
              echo "$body" >&2
              return 1
            fi
          }
          VERSION="${TAG#v}"
          for ARCH in amd64 arm64; do
            ARCHIVE="towonel-${VERSION}-${ARCH}-linux.tar.gz"
            upload "${ARCHIVE}"
            upload "${ARCHIVE}.sha256"
            upload "${ARCHIVE}.cosign.bundle"
          done
  helm:
    needs: [release, container]
    runs-on: docker
    env:
      # renovate: datasource=github-releases depName=sigstore/cosign
      COSIGN_VERSION: "3.0.5"
    steps:
      - uses: https://data.forgejo.org/actions/checkout@v6
      - uses: https://github.com/azure/setup-helm@v5
        with:
          # Pin Helm 3 so `helm push` keeps emitting the "Digest:" line the
          # chart-signing step parses; Helm 4 changed plugin/OCI behaviour.
          version: v3.21.0
      - name: Login to codeberg.org
        env:
          CODEBERG_TOKEN: ${{ secrets.CODEBERG_TOKEN }}
          USERNAME: ${{ vars.USERNAME }}
        run: |
          set -euo pipefail
          echo "${CODEBERG_TOKEN}" | helm registry login codeberg.org --username "${USERNAME}" --password-stdin
      # Released charts reference immutable images; fail closed rather than
      # fall back to a floating tag.
      - name: Pin the released image digests into the charts
        env:
          NODE_DIGEST: ${{ needs.container.outputs.node-digest }}
          AGENT_DIGEST: ${{ needs.container.outputs.agent-digest }}
        run: |
          set -euo pipefail
          [ -n "${NODE_DIGEST}" ] && [ -n "${AGENT_DIGEST}" ] || { echo "build produced no digest" >&2; exit 1; }
          # The image digest lives at controllers.main.containers.main.image.digest;
          # match any indentation so the pin survives values.yaml restructuring.
          pin() {
            sed -i "s|^\( *\)digest: \"\"\$|\1digest: \"$2\"|" "charts/$1/values.yaml"
            grep -q "digest: \"$2\"\$" "charts/$1/values.yaml"
          }
          pin towonel-node "${NODE_DIGEST}"
          pin towonel-agent "${AGENT_DIGEST}"
      - name: Package and push charts
        env:
          TAG: ${{ needs.release.outputs.tag }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          helm repo add bjw-s https://bjw-s-labs.github.io/helm-charts
          : > chart-digests.txt
          for chart in charts/*/; do
            NAME="$(basename "$chart")"
            helm dependency build "$chart"
            helm package "$chart" --version "${VERSION}" --app-version "${VERSION}"
            OUTPUT="$(helm push "${NAME}-${VERSION}.tgz" "oci://codeberg.org/towonel/charts" 2>&1)"
            echo "$OUTPUT"
            DIGEST="$(echo "$OUTPUT" | sed -n 's/^Digest: //p')"
            if [ -z "$DIGEST" ]; then
              echo "failed to parse digest for ${NAME}" >&2
              exit 1
            fi
            echo "codeberg.org/towonel/charts/${NAME}@${DIGEST}" >> chart-digests.txt
          done
      - name: Install cosign
        run: |
          set -euo pipefail
          HOST_ARCH="$(uname -m)"
          case "$HOST_ARCH" in
            x86_64) COSIGN_BIN="cosign-linux-amd64" ;;
            aarch64) COSIGN_BIN="cosign-linux-arm64" ;;
            *) echo "unsupported host arch: $HOST_ARCH" >&2; exit 1 ;;
          esac
          BASE="https://github.com/sigstore/cosign/releases/download/v${COSIGN_VERSION}"
          curl -fsSL -o "${COSIGN_BIN}" "${BASE}/${COSIGN_BIN}"
          curl -fsSL "${BASE}/cosign_checksums.txt" -o checksums.txt
          grep "[[:space:]]${COSIGN_BIN}\$" checksums.txt | sha256sum -c -
          install -m 0755 "${COSIGN_BIN}" /usr/local/bin/cosign
          rm -f "${COSIGN_BIN}" checksums.txt
      - name: Cosign sign charts
        env:
          COSIGN_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
          CODEBERG_TOKEN: ${{ secrets.CODEBERG_TOKEN }}
          USERNAME: ${{ vars.USERNAME }}
        run: |
          set -euo pipefail
          # helm registry login only fills helm's config; cosign reads the
          # docker config, so it needs its own login.
          echo "${CODEBERG_TOKEN}" | cosign login codeberg.org --username "${USERNAME}" --password-stdin
          xargs cosign sign --yes --key env://COSIGN_KEY < chart-digests.txt
