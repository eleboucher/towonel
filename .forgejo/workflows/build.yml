name: Build and push container images
on:
  push:
    branches: [main]
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build-images:
    runs-on: multiarch
    steps:
      - uses: https://data.forgejo.org/actions/checkout@v6
      - uses: https://github.com/taiki-e/install-action@v2
        with:
          tool: cargo
      - uses: https://data.forgejo.org/docker/setup-qemu-action@v4
        with:
          platforms: arm64
      - uses: https://data.forgejo.org/docker/setup-buildx-action@v4
      - name: Compute build timestamp
        id: build-meta
        run: echo "created=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
      - name: Login to codeberg.org
        uses: https://data.forgejo.org/docker/login-action@v4
        with:
          registry: codeberg.org
          username: ${{ vars.USERNAME }}
          password: ${{ secrets.CODEBERG_TOKEN }}
      - name: Login to registry.erwanleboucher.dev
        uses: https://data.forgejo.org/docker/login-action@v4
        with:
          registry: registry.erwanleboucher.dev
          username: ${{ vars.USERNAME }}
          password: ${{ secrets.APOCI_REGISTRY_TOKEN }}
      - name: Compute node image metadata
        id: meta-node
        uses: https://data.forgejo.org/docker/metadata-action@v6
        with:
          images: |
            codeberg.org/towonel/towonel-node
            registry.erwanleboucher.dev/${{ vars.USERNAME }}/towonel-node
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=long
          labels: |
            org.opencontainers.image.title=towonel
            org.opencontainers.image.description=Towonel hub/edge node — Iroh-based tunnel control plane and data plane
            org.opencontainers.image.documentation=https://codeberg.org/towonel/towonel/src/branch/main/README.md
            org.opencontainers.image.authors=Erwan Leboucher <erwanleboucher@gmail.com>
            org.opencontainers.image.vendor=Erwan Leboucher
      - name: Build and push towonel-node
        uses: https://data.forgejo.org/docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.node
          platforms: linux/amd64,linux/arm64
          push: true
          sbom: true
          provenance: mode=max
          tags: ${{ steps.meta-node.outputs.tags }}
          labels: ${{ steps.meta-node.outputs.labels }}
          cache-from: type=gha,scope=towonel-node
          cache-to: type=gha,scope=towonel-node,mode=max
          build-args: |
            ENABLE_SCCACHE=1
            VERSION=${{ steps.meta-node.outputs.version }}
            REVISION=${{ github.sha }}
            CREATED=${{ steps.build-meta.outputs.created }}
          secrets: |
            SCCACHE_AWS_ACCESS_KEY_ID=${{ secrets.SCCACHE_AWS_ACCESS_KEY_ID }}
            SCCACHE_AWS_SECRET_ACCESS_KEY=${{ secrets.SCCACHE_AWS_SECRET_ACCESS_KEY }}
      - name: Compute agent image metadata
        id: meta-agent
        uses: https://data.forgejo.org/docker/metadata-action@v6
        with:
          images: |
            codeberg.org/towonel/towonel-agent
            registry.erwanleboucher.dev/${{ vars.USERNAME }}/towonel-agent
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=long
          labels: |
            org.opencontainers.image.title=towonel-agent
            org.opencontainers.image.description=Towonel agent — exposes local services through a towonel hub
            org.opencontainers.image.documentation=https://codeberg.org/towonel/towonel/src/branch/main/README.md
            org.opencontainers.image.authors=Erwan Leboucher <erwanleboucher@gmail.com>
            org.opencontainers.image.vendor=Erwan Leboucher
      - name: Build and push towonel-agent
        uses: https://data.forgejo.org/docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.agent
          platforms: linux/amd64,linux/arm64
          push: true
          sbom: true
          provenance: mode=max
          tags: ${{ steps.meta-agent.outputs.tags }}
          labels: ${{ steps.meta-agent.outputs.labels }}
          cache-from: type=gha,scope=towonel-agent
          cache-to: type=gha,scope=towonel-agent,mode=max
          build-args: |
            ENABLE_SCCACHE=1
            VERSION=${{ steps.meta-agent.outputs.version }}
            REVISION=${{ github.sha }}
            CREATED=${{ steps.build-meta.outputs.created }}
          secrets: |
            SCCACHE_AWS_ACCESS_KEY_ID=${{ secrets.SCCACHE_AWS_ACCESS_KEY_ID }}
            SCCACHE_AWS_SECRET_ACCESS_KEY=${{ secrets.SCCACHE_AWS_SECRET_ACCESS_KEY }}
      - name: Compute hub-caddy image metadata
        id: meta-hub-caddy
        uses: https://data.forgejo.org/docker/metadata-action@v6
        with:
          images: |
            codeberg.org/towonel/towonel-hub-caddy
            registry.erwanleboucher.dev/${{ vars.USERNAME }}/towonel-hub-caddy
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=long
          labels: |
            org.opencontainers.image.title=towonel-hub-caddy
            org.opencontainers.image.description=Towonel hub bundled with Caddy (L4 PROXY-protocol shifter for privileged ports)
            org.opencontainers.image.documentation=https://codeberg.org/towonel/towonel/src/branch/main/README.md
            org.opencontainers.image.authors=Erwan Leboucher <erwanleboucher@gmail.com>
            org.opencontainers.image.vendor=Erwan Leboucher
      - name: Build and push towonel-hub-caddy
        uses: https://data.forgejo.org/docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.hub-caddy
          platforms: linux/amd64,linux/arm64
          push: true
          sbom: true
          provenance: mode=max
          tags: ${{ steps.meta-hub-caddy.outputs.tags }}
          labels: ${{ steps.meta-hub-caddy.outputs.labels }}
          cache-from: type=gha,scope=towonel-hub-caddy
          cache-to: type=gha,scope=towonel-hub-caddy,mode=max
          build-args: |
            ENABLE_SCCACHE=1
            VERSION=${{ steps.meta-hub-caddy.outputs.version }}
            REVISION=${{ github.sha }}
            CREATED=${{ steps.build-meta.outputs.created }}
          secrets: |
            SCCACHE_AWS_ACCESS_KEY_ID=${{ secrets.SCCACHE_AWS_ACCESS_KEY_ID }}
            SCCACHE_AWS_SECRET_ACCESS_KEY=${{ secrets.SCCACHE_AWS_SECRET_ACCESS_KEY }}
