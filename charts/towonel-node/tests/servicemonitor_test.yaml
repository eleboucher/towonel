suite: node servicemonitor
templates:
  - common.yaml.tpl
set:
  edge.enabled: false
tests:
  - it: scrapes hub-metrics when enabled
    set:
      serviceMonitor.main.enabled: true
    documentSelector:
      path: kind
      value: ServiceMonitor
    asserts:
      - isKind:
          of: ServiceMonitor
      - equal:
          path: spec.endpoints[0].port
          value: hub-metrics
