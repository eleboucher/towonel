suite: node hub workload
templates:
  - common.yaml.tpl
set:
  edge.enabled: false
tests:
  - it: renders a hub Deployment with Recreate strategy
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - isKind:
          of: Deployment
      - equal:
          path: spec.strategy.type
          value: Recreate
      - equal:
          path: spec.replicas
          value: 1

  - it: uses the repository:appVersion image, digest-pinnable
    set:
      controllers.main.containers.main.image.digest: "sha256:abc123"
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: codeberg.org/towonel/towonel-node:0.0.0@sha256:abc123

  - it: enables the hub role and its listeners
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: TOWONEL_HUB_ENABLED
            value: "true"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: TOWONEL_EDGE_ENABLED
            value: "false"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: TOWONEL_HUB_LISTEN_ADDR
            value: 0.0.0.0:8443
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: TOWONEL_HUB_RATE_LIMIT_PER_SEC
            value: "5"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: TOWONEL_HUB_RATE_LIMIT_BURST
            value: "30"

  - it: binds the hub listeners on the configured addresses
    set:
      hub.bindAddress: "[::]"
      hub.healthBindAddress: "[::1]"
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: TOWONEL_HUB_LISTEN_ADDR
            value: "[::]:8443"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: TOWONEL_HUB_LINK_LISTEN_ADDR
            value: "[::]:51444"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: TOWONEL_HUB_HEALTH_LISTEN_ADDR
            value: "[::1]:9091"

  - it: declares the hub container ports
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - contains:
          path: spec.template.spec.containers[0].ports
          content:
            name: hub-api
            containerPort: 8443
            protocol: TCP
      - contains:
          path: spec.template.spec.containers[0].ports
          content:
            name: hub-metrics
            containerPort: 9091
            protocol: TCP

  - it: probes the hub API for health and readiness
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - equal:
          path: spec.template.spec.containers[0].livenessProbe.httpGet.path
          value: /v1/health
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.httpGet.path
          value: /v1/readyz
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.httpGet.port
          value: hub-api
      - equal:
          path: spec.template.spec.containers[0].startupProbe.periodSeconds
          value: 5
      - equal:
          path: spec.template.spec.containers[0].startupProbe.failureThreshold
          value: 60
      - equal:
          path: spec.template.spec.containers[0].livenessProbe.periodSeconds
          value: 30
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.periodSeconds
          value: 10

  - it: honours probe overrides over the role defaults
    set:
      controllers.main.containers.main.probes.liveness.spec.periodSeconds: 99
      controllers.main.containers.main.probes.readiness.path: /custom
      controllers.main.containers.main.probes.startup.enabled: false
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - equal:
          path: spec.template.spec.containers[0].livenessProbe.periodSeconds
          value: 99
      - equal:
          path: spec.template.spec.containers[0].livenessProbe.httpGet.path
          value: /v1/health
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.httpGet.path
          value: /custom
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.httpGet.port
          value: hub-api
      - notExists:
          path: spec.template.spec.containers[0].startupProbe

  - it: keeps the container locked down and non-root
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - equal:
          path: spec.template.spec.securityContext.runAsUser
          value: 10001
      - equal:
          path: spec.template.spec.containers[0].securityContext.allowPrivilegeEscalation
          value: false
      - contains:
          path: spec.template.spec.containers[0].securityContext.capabilities.add
          content: NET_BIND_SERVICE

  - it: applies the hub resource defaults
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - equal:
          path: spec.template.spec.containers[0].resources.limits.memory
          value: 512Mi
