suite: node hub workload
templates:
  - common.yaml.tpl
set:
  edge.enabled: false
tests:
  - it: renders a hub Deployment with Recreate strategy
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - isKind:
          of: Deployment
      - equal:
          path: spec.strategy.type
          value: Recreate
      - equal:
          path: spec.replicas
          value: 1

  - it: uses the repository:appVersion image, digest-pinnable
    set:
      controllers.main.containers.main.image.digest: "sha256:abc123"
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: codeberg.org/towonel/towonel-node:0.0.0@sha256:abc123

  - it: enables the hub role and its listeners
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: TOWONEL_HUB_ENABLED
            value: "true"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: TOWONEL_EDGE_ENABLED
            value: "false"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: TOWONEL_HUB_LISTEN_ADDR
            value: 0.0.0.0:8443

  - it: declares the hub container ports
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - contains:
          path: spec.template.spec.containers[0].ports
          content:
            name: hub-api
            containerPort: 8443
            protocol: TCP
      - contains:
          path: spec.template.spec.containers[0].ports
          content:
            name: hub-metrics
            containerPort: 9091
            protocol: TCP

  - it: probes the hub API for health and readiness
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - equal:
          path: spec.template.spec.containers[0].livenessProbe.httpGet.path
          value: /v1/health
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.httpGet.path
          value: /v1/readyz
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.httpGet.port
          value: hub-api

  - it: keeps the container locked down and non-root
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - equal:
          path: spec.template.spec.securityContext.runAsUser
          value: 10001
      - equal:
          path: spec.template.spec.containers[0].securityContext.allowPrivilegeEscalation
          value: false
      - contains:
          path: spec.template.spec.containers[0].securityContext.capabilities.add
          content: NET_BIND_SERVICE

  - it: applies the hub resource defaults
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - equal:
          path: spec.template.spec.containers[0].resources.limits.memory
          value: 512Mi
