suite: node service
templates:
  - common.yaml.tpl
set:
  edge.enabled: false
tests:
  - it: exposes the hub ports by default
    documentSelector:
      path: kind
      value: Service
    asserts:
      - isKind:
          of: Service
      - contains:
          path: spec.ports
          content:
            name: hub-api
            port: 8443
            protocol: TCP
            targetPort: hub-api
      - contains:
          path: spec.ports
          content:
            name: hub-link
            port: 51444
            protocol: TCP
            targetPort: hub-link
