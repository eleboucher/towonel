# yaml-language-server: $schema=values.schema.json
# Default values for towonel-node — the towonel hub/edge node.
#
# This chart renders via the bjw-s `common` library, but keeps a friendly
# hub/edge config block whose values are derived into the workload kind, role
# env, listeners, container/Service ports, probes, resources, securityContext,
# hostNetwork and data volume by templates/_config.tpl before common renders.
# App-level config (DB DSN, public URLs, OIDC, OTEL), envFrom, persistence and
# scheduling use common's native schema and can be set directly.
#
# Defaults enable both roles (the single-node topology): an enabled edge renders
# a hostNetwork DaemonSet binding the public 443/80 listeners; hub-only renders a
# Deployment. Split the roles by disabling one of hub.enabled / edge.enabled.

global:
  # -- Override the chart name used in resource names.
  nameOverride: ""
  # -- Override the full release name.
  fullnameOverride: ""

hub:
  # -- Run the hub control plane (TOWONEL_HUB_ENABLED).
  enabled: true
  # -- Port the user/operator HTTP API listens on.
  apiPort: 8443
  # -- Port edges dial for the hub link.
  linkPort: 51444
  # -- Port serving hub health and Prometheus metrics.
  metricsPort: 9091

edge:
  # -- Run the public edge (TOWONEL_EDGE_ENABLED). Switches the workload to a
  # hostNetwork DaemonSet; pin it to the right nodes with nodeSelector/affinity.
  enabled: true
  # -- Bind address for the public TLS and plain-HTTP listeners. "[::]" is dual-stack.
  bindAddress: "[::]"
  # -- Bind address for the edge health/metrics listener.
  healthBindAddress: 0.0.0.0
  # -- Public TLS port.
  httpsPort: 443
  # -- Plain HTTP port for ACME HTTP-01 and redirects.
  httpPort: 80
  # -- Port serving edge health and Prometheus metrics.
  metricsPort: 9090
  # -- Data directory backed by an emptyDir volume (TOWONEL_DATA_DIR).
  dataDir: /data

workload:
  # -- Workload kind: deployment or daemonset. Empty picks the role default
  # (daemonset when the edge is enabled, deployment otherwise).
  kind: ""
  # -- Deployment update strategy (hub-only). Empty defaults to Recreate, because
  # the hub is active/passive: a surged pod only passes /v1/readyz once it wins
  # the Postgres advisory lock the old leader holds, so the old pod must
  # terminate first. RollingUpdate (maxUnavailable:0) would deadlock the rollout.
  strategy: ""

# -- Pod-wide defaults applied to every controller. hostNetwork + dnsPolicy are
# set automatically when the edge is enabled.
defaultPodOptions:
  enableServiceLinks: false
  # -- The node does not talk to the cluster API.
  automountServiceAccountToken: false
  # -- Grace period for in-flight connections on shutdown.
  terminationGracePeriodSeconds: 30
  # -- Pod-level securityContext: non-root uid/gid 10001. The edge binds its
  # privileged host ports (443/80) as this non-root user via the binary's file
  # capabilities, so it never runs as root.
  securityContext:
    runAsNonRoot: true
    runAsUser: 10001
    runAsGroup: 10001
    fsGroup: 10001
    seccompProfile:
      type: RuntimeDefault

controllers:
  main:
    # type and strategy are derived from the hub/edge roles by _config.tpl.
    # -- Replicas (Deployment only; only one hub replica is the active leader).
    replicas: 1
    annotations: {}
    containers:
      main:
        image:
          # -- Image repository.
          repository: codeberg.org/towonel/towonel-node
          # -- Image tag; defaults to the chart appVersion.
          tag: "{{ .Chart.AppVersion }}"
          # -- Pin the image by digest (sha256:...); the release pipeline fills it.
          digest: ""
          # -- Image pull policy.
          pullPolicy: IfNotPresent
        # -- Container securityContext (read-only root filesystem, drops ALL
        # capabilities, keeps NET_BIND_SERVICE for privileged listeners).
        # allowPrivilegeEscalation is dropped automatically when the edge is
        # enabled — NoNewPrivs would block the file-cap bind of 443/80.
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
              - ALL
            add:
              - NET_BIND_SERVICE
        # env, ports, probes and resources are derived from the hub/edge roles.
        # App config (DB DSN, public URLs, OIDC, OTEL) merges in here as a map:
        # env:
        #   TOWONEL_HUB_DB_DRIVER: postgres
        envFrom: []
        # - secretRef:
        #     name: towonel-hub-secret

# -- Service exposing the enabled listeners (ports derived from the roles).
service:
  main:
    controller: main
    primary: true
    type: ClusterIP

# -- Prometheus Operator ServiceMonitor. Disabled by default; set enabled:true
# (requires the ServiceMonitor CRD). Endpoints are derived from the enabled roles.
serviceMonitor:
  main:
    enabled: false

# Chart-specific monitoring extras rendered by standalone templates
# (common has no first-class PrometheusRule/GrafanaDashboard).
monitoring:
  prometheusRule:
    # -- Create a PrometheusRule with the hub alerting rules.
    enabled: false
    # -- PrometheusRule annotations.
    annotations: {}
    # -- PrometheusRule labels.
    labels: {}
    # -- Extra labels added to every alert rule (e.g. cluster).
    additionalRuleLabels: {}

  dashboards:
    # -- Render the Grafana dashboard ConfigMap (for grafana-operator or the
    # kube-prometheus-stack sidecar). The dashboard covers hub and edge metrics.
    enabled: false
    # -- Namespace for the dashboard objects; defaults to the release namespace.
    namespace: ""
    # -- Annotations added to the dashboard ConfigMap.
    annotations: {}
    # -- Labels added to the dashboard ConfigMap.
    labels: {}
    grafanaOperator:
      # -- Render a GrafanaDashboard CR (grafana-operator) instead of a sidecar ConfigMap.
      enabled: false
      # -- If true allows for a Grafana in any namespace to access this GrafanaDashboard.
      allowCrossNamespaceImport: true
      # -- Folder to create the dashboard in.
      folder: ""
      # -- Resync period for the Grafana operator to check for updates to the dashboard.
      resyncPeriod: "10m"
      # -- Selector labels for the Grafana instance. Must be set when enabled.
      matchLabels: {}
