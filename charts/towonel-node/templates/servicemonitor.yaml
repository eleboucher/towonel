{{- if .Values.monitoring.serviceMonitor.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "towonel-node.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "towonel-node.labels" . | nindent 4 }}
    {{- with .Values.monitoring.serviceMonitor.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- with .Values.monitoring.serviceMonitor.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  selector:
    matchLabels:
      {{- include "towonel-node.selectorLabels" . | nindent 6 }}
  endpoints:
    {{- range $port := list "hub-metrics" "edge-metrics" }}
    {{- if eq $port "hub-metrics" | ternary $.Values.hub.enabled $.Values.edge.enabled }}
    - port: {{ $port }}
      interval: {{ $.Values.monitoring.serviceMonitor.interval | default "30s" }}
      scrapeTimeout: {{ $.Values.monitoring.serviceMonitor.scrapeTimeout | default "10s" }}
      path: {{ $.Values.monitoring.serviceMonitor.path | default "/metrics" }}
      {{- with $.Values.monitoring.serviceMonitor.metricRelabelings }}
      metricRelabelings:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $.Values.monitoring.serviceMonitor.relabelings }}
      relabelings:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    {{- end }}
    {{- end }}
{{- end }}
