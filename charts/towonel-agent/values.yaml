# yaml-language-server: $schema=values.schema.json
# Default values for towonel-agent — origin-side connector for towonel tunnels.
#
# This chart renders via the bjw-s `common` library, but keeps a friendly
# `agent` config block (plus relayUrl / directConnect / hostNetwork) whose values
# are derived into the container env, ports, Service and RBAC by templates/_config.tpl
# before common renders. Everything else uses common's native schema and can be
# overridden directly (controllers / containers / service / ...).

global:
  # -- Override the chart name used in resource names.
  nameOverride: ""
  # -- Override the full release name.
  fullnameOverride: ""

# Friendly agent configuration (derived into the container env / ports).
agent:
  # -- Log level (RUST_LOG).
  logLevel: info
  # -- Port serving health and Prometheus metrics (TOWONEL_AGENT_HEALTH_LISTEN_ADDR).
  healthPort: 9090
  # -- Bind address for the health/metrics listener. "[::]" is dual-stack.
  healthBindAddress: 0.0.0.0
  # -- HTTPS services exposed through the tunnel (TOWONEL_AGENT_SERVICES).
  services: []
  # - hostname: "*.example.com"
  #   origin: envoy-external.network.svc.cluster.local:443
  # -- Raw TCP services exposed through the tunnel (TOWONEL_AGENT_TCP_SERVICES).
  tcpServices: []
  # - name: forgejo-ssh
  #   origin: envoy-external.network.svc.cluster.local:2222
  #   listen_port: 2222
  # -- UDP services exposed through the tunnel (TOWONEL_AGENT_UDP_SERVICES).
  udpServices: []
  # - name: stunner-turn-udp
  #   origin: stunner.network.svc.cluster.local:3478
  #   listen_port: 3478
  inviteTokenSecret:
    # -- Name of the Secret holding the invite token (TOWONEL_INVITE_TOKEN).
    # Leave empty to skip the env var.
    name: ""
    # -- Key inside the Secret.
    key: TOWONEL_INVITE_TOKEN

# -- Relay URL(s), comma-separated (TOWONEL_AGENT_RELAY_URL). Empty uses the hub-advertised relay.
relayUrl: ""
# -- Reachable local addresses advertised to edges, comma-separated host:port (TOWONEL_AGENT_EXTRA_LOCAL_ADDRS).
extraLocalAddrs: ""
# -- Disable UDP segmentation offload (TOWONEL_DISABLE_UDP_GSO) for pod datapaths
# that drop offloaded sends.
disableUdpGso: false
# -- Run the agent on the host network (workaround for pod datapaths that break
# QUIC UDP sends). dnsPolicy switches to ClusterFirstWithHostNet.
hostNetwork: false

# Relay-less direct connectivity: bind a fixed iroh UDP port, expose it as a
# NodePort, and advertise the node IP + nodePort via autodiscovery (also grants
# Node/Service read RBAC and mounts the token).
directConnect:
  # -- Enable relay-less direct connectivity (NodePort + node autodiscovery).
  enabled: false
  # -- Fixed iroh UDP port the agent binds and the NodePort targets (TOWONEL_AGENT_IROH_PORT).
  irohPort: 51820
  # @schema
  # type: [integer, "null"]
  # @schema
  # -- Explicit nodePort for the iroh UDP port; null lets Kubernetes assign one.
  nodePort: null
  # -- Annotations for the direct (NodePort) Service.
  annotations: {}

# -- Pod-wide defaults applied to every controller.
defaultPodOptions:
  enableServiceLinks: false
  # -- The agent does not talk to the cluster API unless directConnect is enabled.
  automountServiceAccountToken: false
  # -- Grace period for in-flight streams on shutdown.
  terminationGracePeriodSeconds: 30
  # -- Pod-level securityContext (runs as non-root uid/gid 10001).
  securityContext:
    runAsNonRoot: true
    runAsUser: 10001
    runAsGroup: 10001
    fsGroup: 10001
    seccompProfile:
      type: RuntimeDefault

controllers:
  main:
    type: deployment
    # -- Rolling update keeps an agent serving during upgrades (stateless, 2 replicas).
    strategy: RollingUpdate
    # -- Number of agent replicas (two give edge-session redundancy).
    replicas: 2
    annotations: {}
    containers:
      main:
        image:
          # -- Image repository.
          repository: codeberg.org/towonel/towonel-agent
          # -- Image tag; defaults to the chart appVersion.
          tag: "{{ .Chart.AppVersion }}"
          # -- Pin the image by digest (sha256:...); the release pipeline fills it.
          digest: ""
          # -- Image pull policy.
          pullPolicy: IfNotPresent
        # -- Container securityContext (no privilege escalation, read-only root
        # filesystem, drops ALL capabilities).
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
              - ALL
        # env and ports are derived from the agent config by templates/_config.tpl.
        probes:
          startup:
            enabled: true
            type: HTTP
            path: /healthz
            port: metrics
            spec:
              initialDelaySeconds: 2
              periodSeconds: 2
              failureThreshold: 30
          liveness:
            enabled: true
            type: HTTP
            path: /healthz
            port: metrics
            spec:
              initialDelaySeconds: 10
              periodSeconds: 30
              timeoutSeconds: 3
              failureThreshold: 3
          readiness:
            enabled: true
            type: HTTP
            path: /healthz
            port: metrics
            spec:
              initialDelaySeconds: 3
              periodSeconds: 10
              timeoutSeconds: 3
              failureThreshold: 3
        # -- Pod resource requests/limits.
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            memory: 256Mi

# -- ClusterIP Service exposing the metrics endpoint (port derived from agent.healthPort).
service:
  main:
    controller: main
    primary: true
    ports:
      metrics:
        port: 9090
        protocol: TCP
        targetPort: metrics

# -- Prometheus Operator ServiceMonitor. Disabled by default; set enabled:true
# (requires the ServiceMonitor CRD).
serviceMonitor:
  main:
    enabled: false
    endpoints:
      - port: metrics
        interval: 30s
        scrapeTimeout: 10s
        path: /metrics

# Chart-specific monitoring extras rendered by standalone templates
# (common has no first-class PrometheusRule/GrafanaDashboard).
monitoring:
  prometheusRule:
    # -- Create a PrometheusRule with the agent alerting rules.
    enabled: false
    # -- PrometheusRule annotations.
    annotations: {}
    # -- PrometheusRule labels.
    labels: {}
    # -- Extra labels added to every alert rule (e.g. cluster).
    additionalRuleLabels: {}

  dashboards:
    # -- Render the Grafana dashboard ConfigMap (for grafana-operator or the
    # kube-prometheus-stack sidecar).
    enabled: false
    # -- Namespace for the dashboard objects; defaults to the release namespace.
    namespace: ""
    # -- Annotations added to the dashboard ConfigMap.
    annotations: {}
    # -- Labels added to the dashboard ConfigMap.
    labels: {}
    grafanaOperator:
      # -- Render a GrafanaDashboard CR (grafana-operator) instead of a sidecar ConfigMap.
      enabled: false
      # -- If true allows for a Grafana in any namespace to access this GrafanaDashboard.
      allowCrossNamespaceImport: true
      # -- Folder to create the dashboard in.
      folder: ""
      # -- Resync period for the Grafana operator to check for updates to the dashboard.
      resyncPeriod: "10m"
      # -- Selector labels for the Grafana instance. Must be set when enabled.
      matchLabels: {}
