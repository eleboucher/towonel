{{- if and .Values.directConnect.enabled .Values.serviceAccount.create -}}
{{- /* Autodiscovery reads this pod's Node (cluster) and the direct Service (namespaced). */ -}}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "towonel-agent.fullname" . }}-node-reader
  labels:
    {{- include "towonel-agent.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "towonel-agent.fullname" . }}-node-reader
  labels:
    {{- include "towonel-agent.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "towonel-agent.fullname" . }}-node-reader
subjects:
  - kind: ServiceAccount
    name: {{ include "towonel-agent.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "towonel-agent.fullname" . }}-service-reader
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "towonel-agent.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "towonel-agent.fullname" . }}-service-reader
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "towonel-agent.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "towonel-agent.fullname" . }}-service-reader
subjects:
  - kind: ServiceAccount
    name: {{ include "towonel-agent.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
