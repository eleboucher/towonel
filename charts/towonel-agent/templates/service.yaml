---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "towonel-agent.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "towonel-agent.labels" . | nindent 4 }}
  {{- with .Values.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - name: metrics
      port: {{ .Values.agent.healthPort }}
      targetPort: metrics
      protocol: TCP
  selector:
    {{- include "towonel-agent.selectorLabels" . | nindent 4 }}
