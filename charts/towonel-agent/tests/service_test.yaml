suite: agent service
templates:
  - common.yaml.tpl
tests:
  - it: renders a ClusterIP Service exposing the metrics port
    documentSelector:
      path: kind
      value: Service
    asserts:
      - isKind:
          of: Service
      - equal:
          path: spec.type
          value: ClusterIP
      - contains:
          path: spec.ports
          content:
            name: metrics
            port: 9090
            protocol: TCP
            targetPort: metrics
