suite: agent prometheusrule
templates:
  - prometheusrule.yaml.tpl
tests:
  - it: is not rendered by default
    asserts:
      - hasDocuments:
          count: 0

  - it: renders the agent alert rules when enabled
    set:
      monitoring.prometheusRule.enabled: true
    asserts:
      - isKind:
          of: PrometheusRule
      - equal:
          path: spec.groups[0].name
          value: towonel-agent.rules
      - equal:
          path: spec.groups[0].rules[0].alert
          value: TowonelAgentEdgeLinkDown
