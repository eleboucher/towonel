suite: service-direct
templates:
  - service-direct.yaml
tests:
  - it: should not render by default
    asserts:
      - hasDocuments:
          count: 0

  - it: should expose the iroh UDP port as a NodePort when directConnect is enabled
    set:
      directConnect.enabled: true
    asserts:
      - isKind:
          of: Service
      - equal:
          path: spec.type
          value: NodePort
      - contains:
          path: spec.ports
          content:
            name: iroh
            port: 51820
            targetPort: iroh
            protocol: UDP

  - it: should pin an explicit nodePort when set
    set:
      directConnect.enabled: true
      directConnect.nodePort: 31820
    asserts:
      - equal:
          path: spec.ports[0].nodePort
          value: 31820
