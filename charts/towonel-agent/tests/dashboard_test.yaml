suite: agent dashboard
templates:
  - dashboard.yaml.tpl
  - grafanadashboard.yaml.tpl
tests:
  - it: is not rendered by default
    asserts:
      - hasDocuments:
          count: 0

  - it: renders a sidecar ConfigMap when enabled
    template: dashboard.yaml.tpl
    set:
      monitoring.dashboards.enabled: true
    asserts:
      - isKind:
          of: ConfigMap
      - equal:
          path: metadata.labels["grafana_dashboard"]
          value: "1"
      - isNotEmpty:
          path: data["towonel-agent.json"]

  - it: renders a GrafanaDashboard CR when grafanaOperator is enabled
    template: grafanadashboard.yaml.tpl
    set:
      monitoring.dashboards.enabled: true
      monitoring.dashboards.grafanaOperator.enabled: true
      monitoring.dashboards.grafanaOperator.matchLabels:
        dashboards: grafana
    asserts:
      - isKind:
          of: GrafanaDashboard
      - equal:
          path: spec.configMapRef.key
          value: towonel-agent.json
