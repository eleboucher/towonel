suite: agent deployment
templates:
  - common.yaml.tpl
tests:
  - it: renders a Deployment
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - isKind:
          of: Deployment

  - it: uses the repository:appVersion image by default
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: codeberg.org/towonel/towonel-agent:0.0.0

  - it: pins the image by digest when set
    set:
      controllers.main.containers.main.image.digest: "sha256:abc123"
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: codeberg.org/towonel/towonel-agent:0.0.0@sha256:abc123

  - it: runs two replicas and rolls on upgrade
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - equal:
          path: spec.replicas
          value: 2
      - equal:
          path: spec.strategy.type
          value: RollingUpdate

  - it: exposes node name, log level and health listener
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: NODE_NAME
            valueFrom:
              fieldRef:
                fieldPath: spec.nodeName
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: RUST_LOG
            value: info
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: TOWONEL_AGENT_HEALTH_LISTEN_ADDR
            value: 0.0.0.0:9090

  - it: binds the health listener on the configured address
    set:
      agent.healthBindAddress: "[::]"
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: TOWONEL_AGENT_HEALTH_LISTEN_ADDR
            value: "[::]:9090"

  - it: keeps an explicit dnsPolicy under hostNetwork
    set:
      hostNetwork: true
      defaultPodOptions.dnsPolicy: None
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - equal:
          path: spec.template.spec.hostNetwork
          value: true
      - equal:
          path: spec.template.spec.dnsPolicy
          value: None

  - it: defaults dnsPolicy to ClusterFirstWithHostNet under hostNetwork
    set:
      hostNetwork: true
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - equal:
          path: spec.template.spec.dnsPolicy
          value: ClusterFirstWithHostNet

  - it: sets pod and container security contexts
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - equal:
          path: spec.template.spec.securityContext.runAsUser
          value: 10001
      - equal:
          path: spec.template.spec.containers[0].securityContext.readOnlyRootFilesystem
          value: true
      - equal:
          path: spec.template.spec.containers[0].securityContext.allowPrivilegeEscalation
          value: false

  - it: does not mount the service account token by default
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - equal:
          path: spec.template.spec.automountServiceAccountToken
          value: false

  - it: probes /healthz on the named metrics port
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - equal:
          path: spec.template.spec.containers[0].livenessProbe.httpGet.path
          value: /healthz
      - equal:
          path: spec.template.spec.containers[0].livenessProbe.httpGet.port
          value: metrics

  - it: declares the metrics container port
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - contains:
          path: spec.template.spec.containers[0].ports
          content:
            name: metrics
            containerPort: 9090
            protocol: TCP

  - it: derives the tunnel service env as JSON and the invite token secret ref
    set:
      agent.services:
        - hostname: "*.example.com"
          origin: svc.ns.svc:443
      agent.tcpServices:
        - name: ssh
          origin: svc.ns.svc:2222
          listen_port: 2222
          proxy_protocol: v2
      agent.inviteTokenSecret.name: towonel-agent-secret
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: TOWONEL_AGENT_SERVICES
            value: '[{"hostname":"*.example.com","origin":"svc.ns.svc:443"}]'
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: TOWONEL_AGENT_TCP_SERVICES
            value: '[{"listen_port":2222,"name":"ssh","origin":"svc.ns.svc:2222","proxy_protocol":"v2"}]'
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: TOWONEL_INVITE_TOKEN
            valueFrom:
              secretKeyRef:
                name: towonel-agent-secret
                key: TOWONEL_INVITE_TOKEN

  - it: does not set tunnel service or invite env by default
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: TOWONEL_AGENT_SERVICES
          any: true
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: TOWONEL_INVITE_TOKEN
          any: true
