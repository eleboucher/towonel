suite: serviceaccount
templates:
  - serviceaccount.yaml
tests:
  - it: should create a ServiceAccount by default
    asserts:
      - isKind:
          of: ServiceAccount
      - equal:
          path: automountServiceAccountToken
          value: false

  - it: should not render when disabled
    set:
      serviceAccount.create: false
    asserts:
      - hasDocuments:
          count: 0
