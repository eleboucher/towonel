suite: agent servicemonitor
templates:
  - common.yaml.tpl
tests:
  - it: scrapes the metrics endpoint when enabled
    set:
      serviceMonitor.main.enabled: true
    documentSelector:
      path: kind
      value: ServiceMonitor
    asserts:
      - isKind:
          of: ServiceMonitor
      - equal:
          path: spec.endpoints[0].port
          value: metrics
      - equal:
          path: spec.endpoints[0].path
          value: /metrics
