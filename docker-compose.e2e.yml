name: towonel-e2e

services:
  pebble:
    build:
      context: .
      dockerfile: Dockerfile.e2e-pebble
    container_name: towonel-e2e-pebble
    command: ["-config", "/pebble-config.json", "-dnsserver", "127.0.0.11:53"]
    environment:
      # Deterministic validation: no random sleeps, no random nonce rejects.
      PEBBLE_VA_NOSLEEP: "1"
      PEBBLE_WFE_NONCEREJECT: "0"
    volumes:
      - ./tests/e2e/fixtures/pebble-config.json:/pebble-config.json:ro
      - ./tests/e2e/fixtures:/certs:ro
    healthcheck:
      test: ["CMD", "curl", "-fsSk", "https://127.0.0.1:14000/dir"]
      interval: 2s
      timeout: 3s
      start_period: 2s
      retries: 20

  hub-node:
    build:
      context: .
      dockerfile: Dockerfile.node
    container_name: towonel-e2e-hub
    environment:
      RUST_LOG: info
      TOWONEL_IDENTITY_KEY_PATH: /data/node.key
      TOWONEL_HUB_ENABLED: "true"
      TOWONEL_HUB_DB_DRIVER: sqlite
      TOWONEL_HUB_DB_DSN: /data/hub.sqlite
      TOWONEL_INVITE_HASH_KEY: ${E2E_INVITE_HASH_KEY}
      TOWONEL_HUB_KEK: ${E2E_HUB_KEK}
      TOWONEL_HUB_LISTEN_ADDR: 0.0.0.0:8443
      TOWONEL_EDGE_LISTEN_ADDR: 0.0.0.0:4443
      TOWONEL_EDGE_IROH_PORT: "51820"
      TOWONEL_EDGE_ADVERTISED_ADDRESSES: hub-node:4443
      TOWONEL_EDGE_PROXY_PROTOCOL: "true"
      TOWONEL_HUB_PUBLIC_URL: https://hub-node:8443
      TOWONEL_HUB_TLS_CERT_DIR: /data/certs
      TOWONEL_HUB_TLS_ACME_EMAIL: ${E2E_HUB_TLS_ACME_EMAIL}
      # Issue certs from the local Pebble CA instead of Let's Encrypt, and
      # trust Pebble's directory cert (SAN=pebble) via the CA we mount below.
      TOWONEL_HUB_TLS_ACME_DIRECTORY_URL: https://pebble:14000/dir
      SSL_CERT_FILE: /certs/pebble-ca.pem
    volumes:
      - hub-data:/data
      - ./tests/e2e/fixtures:/certs:ro
    networks:
      default:
        ipv4_address: 10.171.83.10
    depends_on:
      pebble:
        condition: service_healthy
    healthcheck:
      # SNI hub-node so the resolver serves the cert obtained for that name.
      test: ["CMD", "curl", "--max-time", "2", "-fsSk", "https://hub-node:8443/v1/health"]
      interval: 2s
      timeout: 3s
      start_period: 5s
      retries: 30

  # Adds a second address to the edge's interface from inside its network
  # namespace, so `udp_reply_source` can send to an address that isn't the one
  # the kernel would pick when routing a reply back.
  edge-vip:
    image: alpine:3.21
    container_name: towonel-e2e-edge-vip
    network_mode: "service:hub-node"
    cap_add:
      - NET_ADMIN
    command:
      - sh
      - -ec
      - |
        apk add --no-cache iproute2 >/dev/null
        ip addr replace 10.171.83.200/32 dev eth0
        sleep infinity
    depends_on:
      hub-node:
        condition: service_started
    healthcheck:
      test: ["CMD", "sh", "-c", "ip -4 addr show dev eth0 | grep -q 10.171.83.200"]
      interval: 2s
      timeout: 2s
      start_period: 3s
      retries: 20

  origin:
    image: alpine:3.21
    container_name: towonel-e2e-origin
    command:
      - sh
      - -ec
      - |
        apk add --no-cache socat openssl >/dev/null
        socat -d TCP-LISTEN:9000,reuseaddr,fork EXEC:"/bin/cat" &
        socat -d \
          OPENSSL-LISTEN:9443,reuseaddr,fork,cert=/certs/origin-tls.pem,key=/certs/origin-tls.key,verify=0 \
          EXEC:"/bin/cat" &
        # Plain UDP echo for the single-port case.
        socat -d UDP-LISTEN:5354,reuseaddr,fork EXEC:"/bin/cat" &
        # One echo per port in the range; each replies "<local-port>:<payload>"
        # (SOCAT_SOCKPORT = the origin port hit), proving same-port forwarding.
        for p in 49160 49161 49162; do
          socat -d "UDP-LISTEN:$$p,reuseaddr,fork" \
            SYSTEM:'printf "%s:" "$$SOCAT_SOCKPORT"; cat' &
        done
        wait
    volumes:
      - ./tests/e2e/fixtures:/certs:ro
    healthcheck:
      test: ["CMD", "sh", "-c", "nc -z 127.0.0.1 9000"]
      interval: 2s
      timeout: 2s
      start_period: 3s
      retries: 10

  test-runner:
    build:
      context: .
      dockerfile: Dockerfile.e2e-runner
    container_name: towonel-e2e-runner
    depends_on:
      hub-node:
        condition: service_healthy
      edge-vip:
        condition: service_healthy
      origin:
        condition: service_healthy
    environment:
      RUST_LOG: info,e2e_runner=debug
      E2E_HUB_BASE: https://hub-node:8443
      E2E_EDGE_HOST: hub-node
      E2E_EDGE_VIP: 10.171.83.200
      E2E_EDGE_PORT: "4443"
      E2E_OPERATOR_KEY_FILE: /hub-data/operator.key
      E2E_TENANT_HOSTNAME: ${E2E_TENANT_HOSTNAME}
      E2E_ORIGIN_HOST: origin
      E2E_ORIGIN_TCP_PORT: "9000"
      E2E_ORIGIN_TLS_PORT: "9443"
      E2E_UDP_ECHO_PORT: "5354"
      E2E_UDP_RANGE_START: "49160"
      E2E_UDP_RANGE_END: "49162"
      E2E_BROKER_LISTEN: 0.0.0.0:7777
      E2E_AGENT_CONTAINER: towonel-e2e-agent
      E2E_HUB_CONTAINER: towonel-e2e-hub
      E2E_LIVENESS_BUDGET_SECS: "30"
      E2E_RECOVERY_BUDGET_SECS: "60"
    volumes:
      - ./tests/e2e/fixtures:/fixtures:ro
      - hub-data:/hub-data:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro

  agent:
    build:
      context: .
      dockerfile: Dockerfile.e2e-agent
    container_name: towonel-e2e-agent
    depends_on:
      test-runner:
        condition: service_started
      pebble:
        condition: service_healthy
    environment:
      RUST_LOG: info
      BROKER_URL: http://test-runner:7777/token
      # Fetch Pebble's issuing CA (management API on :15000) so the agent
      # trusts the hub's TLS cert.
      PEBBLE_URL: https://pebble:15000
      TOWONEL_AGENT_SERVICES: |
        [{"hostname":"app.e2e.local","origin":"origin:9443","proxy_protocol":"none"}]
      TOWONEL_AGENT_TCP_SERVICES: |
        [{"name":"echo","origin":"origin:9000","listen_port":9000}]
      TOWONEL_AGENT_UDP_SERVICES: |
        [{"name":"udp-echo","origin":"origin:5354","listen_port":5354,"idle_timeout_secs":120},
         {"name":"udp-relay","origin":"origin","listen_port_range":[49160,49162]}]

volumes:
  hub-data:

# Fixed subnet so `edge-vip` can pin a second edge address the runner knows.
networks:
  default:
    ipam:
      config:
        - subnet: 10.171.83.0/24
