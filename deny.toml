[graph]
all-features = true
no-default-features = false

[advisories]
version = 2
yanked = "deny"
ignore = [
  # Transitive via netdev/netwatch → netlink-packet-*. No safe upgrade.
  "RUSTSEC-2024-0436", # paste unmaintained
]

[licenses]
version = 2
confidence-threshold = 0.9
# Internal workspace crates (towonel-*) are never published, so skip license checks.
private = { ignore = true }
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "CC0-1.0",
  "Zlib",
  "MPL-2.0",
  # webpki-roots ships the Mozilla CA bundle under this license.
  "CDLA-Permissive-2.0",
  # ws_stream_wasm / pharos / async_io_stream (transitive iroh WASM relay deps).
  "Unlicense",
]
exceptions = []

[[licenses.clarify]]
crate = "ring"
expression = "MIT AND ISC AND OpenSSL"
license-files = [{ path = "LICENSE", hash = 0xbd0eed23 }]

[bans]
multiple-versions = "deny"
wildcards = "deny"
# Workspace path deps don't have a version — ignore them.
allow-wildcard-paths = true
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"
allow = []
deny = []
# Duplicates pulled in by the iroh networking stack. Transitive, no upstream fix.
skip = [
  # Our direct dep is on base64 0.23; hyper-util, axum and bollard still pull
  # 0.22. Drops when the http stack moves up.
  { crate = "base64" },
  { crate = "block-buffer" },
  { crate = "core-foundation" },
  { crate = "cpufeatures" },
  { crate = "crypto-common" },
  { crate = "curve25519-dalek" },
  { crate = "digest" },
  { crate = "ed25519" },
  { crate = "ed25519-dalek" },
  { crate = "fiat-crypto" },
  { crate = "getrandom" },
  { crate = "hashbrown" },
  # netdev pulls jni 0.21 while hickory/rustls-platform-verifier pull 0.22.
  { crate = "jni" },
  { crate = "jni-sys" },
  { crate = "netlink-packet-route" },
  { crate = "rand_core" },
  # iroh's ed25519-dalek 3.0.0-pre pulls sha2 0.11 alongside our 0.10. Drops
  # when iroh ships a stable release.
  { crate = "sha2" },
  { crate = "signature" },
  { crate = "syn" },
  { crate = "thiserror" },
  { crate = "thiserror-impl" },
  { crate = "windows-sys" },
  { crate = "windows-targets" },
  { crate = "windows_aarch64_gnullvm" },
  { crate = "windows_aarch64_msvc" },
  { crate = "windows_i686_gnu" },
  { crate = "windows_i686_msvc" },
  { crate = "windows_x86_64_gnu" },
  { crate = "windows_x86_64_gnullvm" },
  { crate = "windows_x86_64_msvc" },
  # wasip2/wasip3 pull different wit-bindgen versions via getrandom.
  { crate = "wit-bindgen" },
  { crate = "r-efi" },
  { crate = "rand" },
  # noq-proto still pins aes-gcm 0.10 while our direct dep is on 0.11; the
  # whole AEAD stack doubles up until noq ships an aes-gcm 0.11 release.
  { crate = "aead" },
  { crate = "aes" },
  { crate = "aes-gcm" },
  { crate = "cipher" },
  { crate = "ctr" },
  { crate = "ghash" },
  { crate = "inout" },
  { crate = "polyval" },
  { crate = "universal-hash" },
]
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
