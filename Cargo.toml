[package]
name = "towonel"
version.workspace = true
edition = "2024"
publish = false

[workspace.package]
version = "0.0.1"

[workspace.lints.rust]
unsafe_code = "forbid"
ambiguous_glob_reexports = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
suspicious = { level = "warn", priority = -1 }
complexity = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
style = { level = "warn", priority = -1 }
correctness = { level = "deny", priority = -1 }

# Common pedantic noise — turn off from the start
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"

# Don't Panic - prevent panics from unwraps and unsafe slicing or indexing.
# Denied so they also surface on bare `cargo check`, not just CI clippy.
string_slice = "deny"
indexing_slicing = "deny"
unwrap_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
get_unwrap = "deny"
unwrap_in_result = "deny"
unchecked_time_subtraction = "deny"
panic_in_result_fn = "deny"
# Optional - see post for caveats
# expect_used = "warn"
# arithmetic_side_effects = "warn"

# Don't Fail Silently - prevent dropped futures and swallowed errors
let_underscore_future = "warn"
let_underscore_must_use = "warn"
unused_result_ok = "warn"
map_err_ignore = "warn"
assertions_on_result_states = "warn"

# Don't Do Bad Async Stuff - prevent deadlocks and concurrency bugs
await_holding_lock = "warn"
await_holding_refcell_ref = "warn"
if_let_mutex = "warn"              # only relevant on editions before 2024
large_futures = "warn"

# Don't Do Unsafe Things with Memory
mem_forget = "warn"
undocumented_unsafe_blocks = "warn"
multiple_unsafe_ops_per_block = "warn"
unnecessary_safety_doc = "warn"
unnecessary_safety_comment = "warn"

# Don't Do Potentially Incorrect Things with Numbers
float_cmp = "warn"
float_cmp_const = "warn"
lossy_float_literal = "warn"
cast_sign_loss = "warn"
invalid_upcast_comparisons = "warn"
# Optional - these effectively force you to document numeric invariants
# cast_possible_wrap = "warn"
# cast_precision_loss = "warn"
# cast_possible_truncation = "warn"

# Don't Do Bad Things That are Easy to Avoid
rc_mutex = "warn"
debug_assert_with_mut_call = "warn"
iter_not_returning_iterator = "warn"
expl_impl_clone_on_copy = "warn"
infallible_try_from = "warn"
dbg_macro = "warn"

# Don't `allow` Your Way Around These Lints - every suppression must be
# a deliberate #[expect(..., reason = "…")] rather than a silent #[allow]
allow_attributes = "warn"
allow_attributes_without_reason = "warn"

[workspace]
resolver = "2"
members = [
  "crates/towonel-common",
  "crates/towonel-agent",
  "crates/towonel-node",
  "crates/e2e-runner",
]

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
panic = "abort"

[dev-dependencies]
towonel-common = { path = "crates/towonel-common" }
iroh = { workspace = true }
tokio = { workspace = true }


[workspace.dependencies]
iroh = { version = "1.0.0-rc.0", features = ["test-utils"] }
ed25519-dalek = { version = "2.2", features = ["serde", "rand_core"] }
ciborium = "0.2"
