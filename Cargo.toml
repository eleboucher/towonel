subtle = "2.6"
zeroize = { version = "1", features = ["derive"] }
rpassword = "7"
tokio-rustls = "0.26"
rustls = { version = "0.23", default-features = false, features = [
  "std",
  "tls12",
  "ring",
] }
rustls-pemfile = "2"
certon = { version = "0.2", default-features = false, features = ["ring"] }
rcgen = "0.14"
webpki-roots = "1.0"
arc-swap = "1.7"
socket2 = { version = "0.6", features = ["all"] }
