[tools]
rust = "1.96.1"
lefthook = "latest"
helm = "latest"
helm-docs = "1.14.2"
"aqua:dadav/helm-schema" = "0.23.4"

# Pinned: `latest` makes mise re-resolve and rebuild these from source on
# every activation (e.g. the helm-docs pre-commit hook), which is slow.
"cargo:cargo-nextest" = "0.9.137"
"cargo:cargo-deny" = "0.19.8"
"cargo:cargo-machete" = "0.9.2"
"cargo:typos-cli" = "1.47.2"
"cargo:taplo-cli" = "0.10.0"

[env]
RUST_BACKTRACE = "1"

[tasks.fmt]
description = "Format code (rustfmt + taplo)"
run = ["cargo fmt --all", "taplo fmt"]

[tasks.check]
description = "Run all CI checks locally"
depends = ["lint", "test", "audit"]

[tasks.lint]
description = "Run fmt, clippy, typos, taplo, machete"
run = [
  "cargo fmt --all -- --check",
  "cargo clippy --workspace --all-targets --all-features -- -D warnings",
  "cargo machete",
  "taplo fmt --check",
  "typos",
]

[tasks.test]
description = "Run tests with nextest"
run = "cargo nextest run --workspace --all-features --no-fail-fast"

[tasks.audit]
description = "Run cargo-deny checks"
run = "cargo deny --all-features check"

[tasks.helm-test]
description = "Lint and unit-test Helm charts (needs the helm-unittest plugin)"
run = ["helm lint charts/*", "helm unittest charts/*"]

[tasks.helm-docs]
description = "Sync dashboards into the charts and generate the chart READMEs + values.schema.json"
run = """
# deploy/grafana holds the canonical, directly-usable dashboards; the chart
# copies are generated artifacts synced from them.
cp deploy/grafana/towonel-hub.json charts/towonel-node/dashboards/towonel-node.json
cp deploy/grafana/towonel-agent.json charts/towonel-agent/dashboards/towonel-agent.json
helm-docs --chart-search-root=charts --log-level=warn
# required/additionalProperties are skipped so the schemas stay permissive:
# values.yaml supplies every default and the free-form maps stay open.
helm-schema --chart-search-root charts --skip-auto-generation required,additionalProperties --append-newline
"""

[tasks.helm-docs-check]
description = "Fail if the generated chart READMEs/schemas/dashboards are stale (CI gate)"
run = """
mise run helm-docs
git diff --exit-code charts/*/README.md charts/*/values.schema.json charts/*/dashboards
"""

[tasks.doc]
description = "Build docs with warnings as errors"
env = { RUSTDOCFLAGS = "-D warnings" }
run = "cargo doc --workspace --all-features --no-deps"

# --- Local hub dev loop (sqlite under .dev/hub, no edge, no TLS) ------------
# Run `mise run hub-dev` in one terminal, then drive the user/invite API from
# another. State is in .dev/hub (gitignored); `mise run hub-reset` wipes it.

[tasks.hub-dev]
description = "Run hub locally on 127.0.0.1:8443 (sqlite, no edge, web API on)"
env = { TOWONEL_EDGE_ENABLED = "false", TOWONEL_HUB_WEB_ENABLED = "true", TOWONEL_DATA_DIR = ".dev/hub", TOWONEL_HUB_LISTEN_ADDR = "127.0.0.1:8443", TOWONEL_HUB_HEALTH_LISTEN_ADDR = "127.0.0.1:9091", RUST_LOG = "towonel=debug,info" }
run = "mkdir -p .dev/hub && cargo run -p towonel-node --bin towonel"

[tasks.hub-reset]
description = "Wipe .dev/hub (operator key, sqlite, generated keys)"
run = "rm -rf .dev/hub"

[tasks.user-create]
description = "Create a hub user. Example: mise run user-create -- --email me@local --role operator"
env = { TOWONEL_DATA_DIR = ".dev/hub" }
run = "cargo run -p towonel-node --bin towonel -- user create"

[tasks.invite-create]
description = "Create a tunnel invite. Example: mise run invite-create -- --hostnames app.local.example.eu --owner-email me@local"
env = { TOWONEL_HUB_URL = "http://127.0.0.1:8443" }
run = "TOWONEL_OPERATOR_KEY=$(cat .dev/hub/operator.key) cargo run -p towonel-node --bin towonel -- invite create"

[tasks.invite-list]
description = "List invites on the local hub"
env = { TOWONEL_HUB_URL = "http://127.0.0.1:8443" }
run = "TOWONEL_OPERATOR_KEY=$(cat .dev/hub/operator.key) cargo run -p towonel-node --bin towonel -- invite list"

[tasks.invite-revoke]
description = "Revoke an invite. Example: mise run invite-revoke -- --id <invite_id>"
env = { TOWONEL_HUB_URL = "http://127.0.0.1:8443" }
run = "TOWONEL_OPERATOR_KEY=$(cat .dev/hub/operator.key) cargo run -p towonel-node --bin towonel -- invite revoke"
